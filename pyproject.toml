[project]
name = "audio-enc"
version = "0.1.0"
description = "Desktop video transcription and SRT subtitle generator"
readme = "README.md"
authors = [
    { name = "rokari-19", email = "oshomahiyelobu1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "av>=11,<19",
    "customtkinter>=6.0.0",
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3",
    "pysubs2>=1.9.0",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
audio-enc = "audio_enc:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
